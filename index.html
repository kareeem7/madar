<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-density="comfort">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5A45">
<meta name="description" content="مدار — مدير مهام وبومودورو ومتتبع عادات في تطبيق واحد. يومك، في مدار واحد.">
<title>مدار — يومك في مدار واحد</title>
<script>
/* إقلاع مبكر: ثيم/لغة/كثافة قبل أول رسم + شبكة أمان للأخطاء */
(function(){try{
var s=JSON.parse(localStorage.getItem('madar:state')||'{}');var st=s.settings||{};var lang=st.lang==='ar'?'ar':'en';
var de=document.documentElement;de.lang=lang;de.dir=lang==='en'?'ltr':'rtl';
de.setAttribute('data-density',st.density||'comfort');
var th=st.theme||'auto',h=new Date().getHours();
var dark=th==='dark'||(th==='auto'&&(matchMedia('(prefers-color-scheme: dark)').matches||h>=19||h<6));
de.setAttribute('data-theme',dark?'dark':'light');
window.addEventListener('error',function(ev){if(!ev||!ev.message)return;
 if(document.getElementById('jsErr'))return;var d=document.createElement('div');d.id='jsErr';
 d.style.cssText='position:fixed;bottom:12px;inset-inline:12px;z-index:9999;background:#C2402A;color:#fff;padding:12px 16px;border-radius:12px;font:13px system-ui;direction:rtl;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)';
 d.textContent='حدث خطأ غير متوقع ('+ev.message+(ev.filename&&ev.lineno?' — '+ev.filename.split('/').pop()+':'+ev.lineno:'')+') — حدّث الصفحة.';
 if(document.body)document.body.appendChild(d)});
}catch(e){}})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<!-- ░░░ Onboarding ░░░ -->
<div id="onboard" hidden></div>

<!-- ░░░ الهيكل ░░░ -->
<div id="appShell">
  <aside id="sidebar" aria-label="التنقل الرئيسي">
    <div class="brand">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="var(--coral)"/><circle cx="256" cy="256" r="150" fill="none" stroke="#FFF3EE" stroke-width="34"/><circle cx="256" cy="106" r="40" fill="#FFF3EE"/></svg>
      <div><b>مدار</b><span id="brandSub">Your day, in one orbit</span></div>
    </div>
    <nav id="mainNav" class="d-flex flex-column gap-1"></nav>
    <div class="side-foot">
      <div class="xp-box">
        <div class="d-flex justify-content-between align-items-center">
          <span class="small fw-bold" id="xpLevel">مستوى 1</span>
          <span class="tiny muted mono" id="xpVal">0 XP</span>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
      </div>
    </div>
  </aside>

  <div class="flex-grow-1 d-flex flex-column" style="min-width:0">
    <header id="topbar">
      <button id="qaTopBtn" class="btn-coral sm"><i class="bi bi-plus-lg"></i><span class="d-none d-md-inline">Quick task</span><kbd class="kbd d-none d-lg-inline">N</kbd></button>
      <button id="searchTrigger" aria-label="Search and commands"><i class="bi bi-search"></i><span>Search or run a command…</span><span class="kbd">Ctrl K</span></button>
      <div class="d-flex align-items-center gap-2" style="margin-inline-start:auto">
        <span class="saved" id="savedChip"><i class="bi bi-check2-all"></i> Saved</span>
        <span id="dateChip"></span>
        <button id="themeBtn" class="icon-btn" aria-label="تبديل المظهر"><i class="bi bi-moon-stars"></i></button>
        <button id="avatarBtn" class="avatar" aria-label="الملف والإعدادات">م</button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="off"></main>
  </div>
</div>

<nav id="bottomnav" aria-label="تنقل سفلي"><div id="bnWrap"></div></nav>

<!-- ░░░ عناصر عائمة ░░░ -->
<div id="miniTimer" hidden>
  <button id="miniOpen" class="d-flex align-items-center gap-2 text-reset" aria-label="Open focus view">
    <span id="miniMode" class="tiny fw-bold opacity-75">Focus</span>
    <b id="miniTime" class="mono">25:00</b>
    <span id="miniTask" class="mini-task"></span>
  </button>
  <button id="miniPause" class="icon-btn" aria-label="Pause"><i class="bi bi-pause-fill"></i></button>
  <button id="miniStop" class="icon-btn" aria-label="End session"><i class="bi bi-stop-fill"></i></button>
</div>

<div id="focusOverlay" hidden>
  <div class="fo-inner">
    <div id="foMode">FOCUS</div>
    <div id="foTime" class="mono">25:00</div>
    <div id="foTask"></div>
    <div class="fo-btns">
      <button id="foPause" class="btn-ghost">Pause</button>
      <button id="foExit" class="btn-coral">End &amp; exit</button>
    </div>
  </div>
</div>

<div id="palette" hidden>
  <div class="pal-backdrop" data-pal-close></div>
  <div class="pal-panel" role="dialog" aria-modal="true" aria-label="لوحة الأوامر">
    <div class="pal-inputwrap"><i class="bi bi-search"></i><input id="palInput" type="text" placeholder="Search tasks and notes, or type a command…" autocomplete="off"></div>
    <ul id="palList" role="listbox"></ul>
    <div class="pal-foot"><span><kbd class="kbd">↑↓</kbd> move</span><span><kbd class="kbd">Enter</kbd> run</span><span><kbd class="kbd">Esc</kbd> close</span></div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toasts" aria-live="polite"></div>
<div id="ariaLive" class="sr-only" aria-live="polite"></div>
<div id="timerLive" class="sr-only" aria-live="polite"></div>
<div id="modalRoot"></div>

<noscript><p style="padding:40px;text-align:center">MADAR needs JavaScript to run.</p></noscript>

<!-- الترتيب مهم: أدوات ← مخزن ← واجهة ← منطق ← شاشات ← أوامر ← إقلاع -->
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/tasks.js"></script>
<script src="js/pomodoro.js"></script>
<script src="js/habits.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/board.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/focus.js"></script>
<script src="js/views/habits.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/commands.js"></script>
<script src="js/app.js"></script>
</body>
</html>
